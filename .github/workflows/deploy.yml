name: Deploy Project to Production Server

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  pull-latest-commit:
    name: Pull Latest Commit on Server
    runs-on: ubuntu-latest
    environment: production
    steps:
    - name: Install SSH Key
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        known_hosts: github.com

    - name: Pull Latest Commit on Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SERVER_PORT }}
        script: |
          eval `ssh-agent -s`
          ssh-add ~/.ssh/kamusbahasamoy

          cd /var/www/

          if [ ! -d "kamusbahasamoy" ]; then
            git clone git@github.com:papuaopensource/kamusbahasamoy.git
          fi

          cd kamusbahasamoy

          git fetch origin main
          git reset --hard
          git checkout -B main ${{ github.sha }}

  build-assets:
    name: Install Dependencies and Build Assets
    runs-on: ubuntu-latest
    environment: production
    needs: pull-latest-commit
    steps:
    - name: Install Dependencies and Build Assets
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SERVER_PORT }}
        script: |
          cd /var/www/kamusbahasamoy

          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

          export PATH="$HOME/.local/bin:$PATH"

          # Install dependencies
          uv sync
          uv run manage.py tailwind install
          
          # Build Tailwind CSS
          uv run manage.py tailwind build
          
          # Collect static files
          uv run manage.py collectstatic --noinput

          # Run database migrations
          uv run manage.py migrate --noinput

  restart-services:
    name: Restart Supervisor services for kamusbahasamoy
    runs-on: ubuntu-latest
    environment: production
    needs: build-assets
    steps:
    - name: Restart Supervisor services for kamusbahasamoy
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SERVER_PORT }}
        script: |
          echo "Restart Supervisor services for kamusbahasamoy"
          sudo supervisorctl restart kamusbahasamoy