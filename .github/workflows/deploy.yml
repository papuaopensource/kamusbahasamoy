name: Deploy FastAPI Backend

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-fastapi-production
  cancel-in-progress: false

jobs:
  sync-backend:
    name: Sync Backend Code and Dependencies
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      DEPLOY_COMMIT: ${{ github.sha }}

    steps:
      - name: Sync Backend Code and Dependencies
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: DEPLOY_COMMIT
          command_timeout: 10m
          script: |
            set -eu

            eval "$(ssh-agent -s)"
            ssh-add "$HOME/.ssh/kamusbahasamoy"

            APP_DIR="/var/www/kamusbahasamoy"
            API_DIR="$APP_DIR/apps/api"

            cd "$APP_DIR"
            git fetch --prune origin main
            git checkout --force -B main "$DEPLOY_COMMIT"

            cd "$API_DIR"
            uv sync --locked --no-dev

            echo "Kode backend dan dependensi berhasil disinkronkan."

  migrate-database:
    name: Migrate and Seed Database
    needs: sync-backend
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    steps:
      - name: Apply migrations and seed data
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 5m
          script: |
            set -eu

            API_DIR="/var/www/kamusbahasamoy/apps/api"

            cd "$API_DIR"
            ./.venv/bin/alembic upgrade head
            ./.venv/bin/python scripts/seed.py

            echo "Migrasi dan seed database berhasil dijalankan."

  restart-backend:
    name: Restart and Verify FastAPI
    needs: migrate-database
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      DEPLOY_COMMIT: ${{ github.sha }}

    steps:
      - name: Restart FastAPI and run health check
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: DEPLOY_COMMIT
          command_timeout: 5m
          script: |
            set -eu

            sudo supervisorctl restart kamusbahasamoy

            attempt=1
            until curl --fail --silent --show-error http://127.0.0.1:5000/health >/dev/null; do
              if [ "$attempt" -ge 15 ]; then
                echo "FastAPI tidak sehat setelah restart."
                sudo supervisorctl status kamusbahasamoy
                exit 1
              fi

              attempt=$((attempt + 1))
              sleep 2
            done

            echo "FastAPI berhasil di-deploy pada commit $DEPLOY_COMMIT."
